name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check build scripts
        run: pnpm exec tsc --noEmit

      - name: Lint sources and tests
        run: pnpm run lint

  test:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: bun test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          name: unit
          use_oidc: true
          fail_ci_if_error: false

  bundle:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: bun run build

      - name: Verify build output
        run: node scripts/verify-build.mjs

      - name: Check bundle syntax
        run: node --check lib/host.js lib/client.js lib/assets/canvas.js

      - name: Pack the npm tarball
        run: |
          mkdir -p .tmp/pkg
          pnpm pack --pack-destination .tmp/pkg

      - name: Verify the tarball contents
        run: node scripts/verify-package.mjs .tmp/pkg/*.tgz

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .tmp/pkg/*.tgz
          retention-days: 7
          if-no-files-found: error

  install-smoke:
    name: Install into a fresh DSH profile
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DSH_HOME: ${{ runner.temp }}/dsh-home
      npm_config_cache: ${{ runner.temp }}/npm-cache
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: .tmp/pkg

      - name: Install the pinned DSH CLI
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.5

      - name: Install the packed bundle into a fresh profile
        run: dsh plugin --profile ci add "$PWD"/.tmp/pkg/*.tgz

      - name: Assert the bundle layer is present
        run: |
          dsh --profile ci --dump-config > dump-config.txt
          cat dump-config.txt
          grep -q "excalidraw-plugin" dump-config.txt
          grep -q "@zcong/dsh-excalidraw-plugin" dump-config.txt
